<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZarxPro — Read The Market. Play Smart.</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07090f;color:#f4f7ff;font-family:Arial,sans-serif}main{max-width:1100px;margin:auto;min-height:100vh;background:radial-gradient(circle at 80% 0,#17203a,transparent 32%),#07090f}
header{height:74px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #20283a;position:sticky;top:0;background:#080a10ee;z-index:5}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border:2px solid #baff35;display:grid;place-items:center;color:#baff35;font-size:25px;font-weight:900;box-shadow:4px 4px #ff2ea6}.brand b{font-size:20px}.brand b span{color:#baff35}.brand small{display:block;color:#77809a;font-size:8px;letter-spacing:3px}.live{color:#baff35;font-size:10px}.hero{padding:52px 20px 28px;border-bottom:1px solid #20283a}.hero p{color:#ff2ea6;font-weight:900;letter-spacing:2px;font-size:10px}.hero h1{font-size:clamp(38px,10vw,82px);line-height:.9;letter-spacing:-3px;margin:15px 0}.hero em{font-style:normal;color:#baff35}.hero .sub{color:#8d96ad}.stats{display:flex;gap:8px;margin-top:30px;overflow:auto}.stats div{border:1px solid #293147;background:#0c101a;padding:12px;min-width:100px;color:#79839b;font-size:10px}.stats b{display:block;color:#fff;font-size:16px;margin-top:4px}nav{display:flex;gap:4px;padding:12px;overflow:auto;border-bottom:1px solid #20283a}nav button{white-space:nowrap;background:#0c1018;border:1px solid #242c3d;color:#79839b;padding:10px 13px;font-size:9px;font-weight:900}nav button.on{background:#baff35;color:#071008}.content{padding:22px 14px 70px}.title{display:flex;align-items:center;gap:10px;margin:14px 0}.title span{color:#ff2ea6;font-size:10px}.title h2{font-size:14px;letter-spacing:2px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card,.panel{background:#0d121d;border:1px solid #263047;padding:15px;box-shadow:5px 5px #121827}.card.short{border-top-color:#ff2ea6}.row{display:flex;justify-content:space-between}.row small{color:#748099}.dir{font-size:24px;font-weight:900;color:#baff35;margin:17px 0}.short .dir{color:#ff2ea6}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.levels div{background:#080b12;padding:8px}.levels small{display:block;color:#69748d;font-size:7px}.levels b{font-size:11px}.bar{height:4px;background:#222a3a;margin:15px 0 8px}.bar i{display:block;height:100%;background:#baff35}.market{border:1px solid #242c3d}.mrow{display:grid;grid-template-columns:1fr 90px 100px 55px;gap:10px;padding:16px;border-bottom:1px solid #1b2230;align-items:center}.mrow:last-child{border:0}.mrow b small{color:#68728a;font-size:8px}.mrow span{color:#baff35}.mrow strong{text-align:right}.mrow em{color:#baff35;text-align:right;font-style:normal;font-size:10px}.mrow em.down{color:#ff2ea6}.panel{min-height:280px}.panel p{color:#8d96ad;line-height:1.6}.feature,.warning{padding:15px;border:1px solid #293147;margin-top:12px}.feature span{float:right;color:#baff35}.warning{color:#ffad73;border-color:#5c3a2a}.cash{border:1px solid #2a3347;padding:22px;margin:20px 0;background:#090d15}.cash small{color:#69748d}.cash b{display:block;font-size:36px;color:#baff35}.claim{background:#baff35;border:0;padding:12px 16px;font-weight:900}footer{border-top:1px solid #20283a;padding:24px 18px;display:flex;gap:20px;flex-wrap:wrap;color:#69748c;font-size:9px;letter-spacing:1px}footer b{color:#baff35}footer small{margin-left:auto}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero h1{letter-spacing:-2px}.mrow{grid-template-columns:1fr 55px 82px 45px}.mrow span{display:none}}
</style></head><body><main>
<header><div class="brand"><span class="logo">Z</span><div><b>ZARX<span>PRO</span></b><small>CRYPTO ARCADE</small></div></div><div class="live">● LIVE</div></header>
<section class="hero"><p>◆ MARKET COMMAND CENTER</p><h1>READ THE MARKET.<br><em>PLAY SMART.</em></h1><div class="sub">Signals, market pulse and portfolio tools — built for fast decisions.</div><div class="stats" id="stats"></div></section>
<nav id="tabs"></nav><section class="content" id="content"></section>
<footer><b>ZARXPRO</b><span>READ THE MARKET · PLAY SMART</span><small>Paper tools only · Not financial advice</small></footer>
</main>
<script>
const demo=[
{id:1,symbol:"BTC/USDT",direction:"LONG",timeframe:"1H",entry:106240,sl:104900,tp:109800,confidence:78,status:"ACTIVE"},
{id:2,symbol:"ETH/USDT",direction:"LONG",timeframe:"4H",entry:4210,sl:4090,tp:4480,confidence:74,status:"ACTIVE"},
{id:3,symbol:"SOL/USDT",direction:"SHORT",timeframe:"15M",entry:196.2,sl:199.8,tp:188.4,confidence:69,status:"WATCH"}];
let prices={BTC:106240,ETH:4210,SOL:196.2},tab="HOME",cash=60;
const tabs=["HOME","MARKET","SIGNALS","SPECIAL","HISTORY","AIRDROPS","PORTFOLIO"];
const money=n=>n>=1000?n.toLocaleString(undefined,{maximumFractionDigits:0}):n.toLocaleString(undefined,{maximumFractionDigits:4});
function card(s){let sh=s.direction==="SHORT";return `<article class="card ${sh?"short":""}"><div class="row"><b>${s.symbol}</b><small>${s.timeframe}</small></div><div class="dir">${sh?"↘":"↗"} ${s.direction}</div><div class="levels"><div><small>ENTRY</small><b>${s.entry}</b></div><div><small>SL</small><b>${s.sl}</b></div><div><small>TP</small><b>${s.tp}</b></div></div><div class="bar"><i style="width:${s.confidence}%"></i></div><small>${s.confidence}% CONFIDENCE · ${s.status}</small></article>`}
function title(n,t){return `<div class="title"><span>${n}</span><h2>${t}</h2></div>`}
function market(){return `<div class="market">${Object.entries(prices).map((x,i)=>`<div class="mrow"><b>${x[0]}<small>/USDT</small></b><span>▂▅▃▇▅█▆</span><strong>$${money(x[1])}</strong><em class="${i===2?"down":""}">${i===2?"-0.8%":"+1.2%"}</em></div>`).join("")}</div>`}
function render(){document.getElementById("tabs").innerHTML=tabs.map(t=>`<button class="${tab===t?"on":""}" onclick="tab='${t}';render()">${t}</button>`).join("");
let c="";if(tab==="HOME")c=title("01","ACTIVE SIGNALS")+`<div class="grid">${demo.slice(0,3).map(card).join("")}</div>`+title("02","MARKET PULSE")+market();
if(tab==="MARKET")c=title("03","MARKET RADAR")+market();
if(tab==="SIGNALS")c=title("04","ALL SIGNALS")+`<div class="grid">${demo.map(card).join("")}</div>`;
if(tab==="SPECIAL")c=`<div class="panel">${title("◆","ZARX SPECIAL")}<p>⚡ SCALP MODE — 15M → 4H</p><div class="feature">🎮 ARCADE XP <span>Coming soon</span></div></div>`;
if(tab==="HISTORY")c=`<div class="panel">${title("◆","TRADE HISTORY")}<p>Your local play-money activity will appear here.</p></div>`;
if(tab==="AIRDROPS")c=`<div class="panel">${title("◆","AIRDROP ZONE")}<p>Track opportunities safely.</p><div class="warning">⚠ NEVER SHARE SEED PHRASES OR PRIVATE KEYS.</div></div>`;
if(tab==="PORTFOLIO")c=`<div class="panel">${title("◆","PAPER PORTFOLIO")}<p>No real orders are placed.</p><div class="cash"><small>VIRTUAL BALANCE</small><b>$${cash.toFixed(2)}</b></div><button class="claim" onclick="cash=60;render()">RESET TO $60</button></div>`;
document.getElementById("content").innerHTML=c;document.getElementById("stats").innerHTML=Object.entries(prices).map(x=>`<div>${x[0]}<b>$${money(x[1])}</b></div>`).join("")}
async function live(){try{let r=await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd");let x=await r.json();prices={BTC:x.bitcoin?.usd||prices.BTC,ETH:x.ethereum?.usd||prices.ETH,SOL:x.solana?.usd||prices.SOL};render()}catch{}}
render();live();
</script></body></html>
